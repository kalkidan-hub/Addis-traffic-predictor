services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://addis-traffic-predictor.fly.dev
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
